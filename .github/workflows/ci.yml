name: CI — Test, Lint, Security, Build

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: acrchurnanalytics.azurecr.io
  IMAGE_NAME: churn-api

jobs:
  # ── Linting & Type Checking ─────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff black mypy isort bandit

      - name: Ruff lint
        run: ruff check api/ ml/

      - name: Black format check
        run: black --check api/ ml/

      - name: isort import order
        run: isort --check-only api/ ml/

      - name: MyPy type check
        run: mypy api/ --ignore-missing-imports --strict-optional

  # ── Unit & Integration Tests ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: churn_analytics_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-minimum-32-chars-long
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/churn_analytics_test
          REDIS_URL: redis://localhost:6379/0
          AZURE_TENANT_ID: test-tenant
          AZURE_CLIENT_ID: test-client
          AZURE_CLIENT_SECRET: test-secret
          AZURE_KEY_VAULT_URL: https://test.vault.azure.net/
          AZURE_OPENAI_ENDPOINT: https://test.openai.azure.com/
          AZURE_OPENAI_API_KEY: test-key
          PII_MASKING_SALT: test-salt-32-chars-minimum-here!!
          AZURE_STORAGE_ACCOUNT: teststorage
          AZURE_STORAGE_KEY: test-key
          MLFLOW_TRACKING_URI: http://localhost:5000
          AZURE_SEARCH_ENDPOINT: https://test.search.windows.net
          AZURE_SEARCH_KEY: test-key
        run: |
          pytest api/tests/ \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

  # ── Security Scanning ────────────────────────────────────────────────────────
  security:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit SAST scan
        run: |
          pip install bandit
          bandit -r api/ -ll -x api/tests/ --format json -o bandit-report.json || true
          # Fail on HIGH or CRITICAL severity
          bandit -r api/ -lll -x api/tests/ --exit-zero

      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Safety dependency vulnerability check
        run: |
          pip install safety
          safety check -r api/requirements.txt --json -o safety-report.json || true
          safety check -r api/requirements.txt

      - name: Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  # ── Secret Scanning ──────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Docker Build & Push ──────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
